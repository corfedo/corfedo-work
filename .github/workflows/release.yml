name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches Version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          props_version="$(dotnet msbuild Version.props -getProperty:Version)"
          if [ "$tag_version" != "$props_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$props_version</Version> in Version.props"
            exit 1
          fi
          case "$tag_version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore
        run: dotnet restore Corfedo.Work.slnx --locked-mode

      - name: Check
        run: dev/check

      - name: Pack
        run: dotnet pack Corfedo.Work.slnx -c Release --no-build -o artifacts/packages

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --api-key "$GITHUB_TOKEN" --no-symbols --skip-duplicate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trusted Publishing: the job's OIDC token is exchanged for an API key valid for one hour, so it is requested
      # just before the push. The nuget.org policy names this repository and release.yml.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: corfedo-ww

      # Pushing a .nupkg uploads the .snupkg next to it to the symbol server.
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
